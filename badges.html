<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медал | Санхүүгийн самбар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
        }

        .hero-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .hero-icon-wrap {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
        }

        .badge-row {
            display: flex;
            align-items: center;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .badge-row:hover {
            transform: translateX(3px);
        }

        .badge-icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            margin-right: 16px;
        }

        .badge-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .status-badge {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .progress {
            background: rgba(255,255,255,0.1) !important;
        }
    </style>
</head>
<body class="roboto-regular">

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fa-solid fa-arrow-left me-2"></i>Буцах
            </a>
            <span class="text-white-50 small">Медалын самбар</span>
        </div>
    </nav>

    <div class="container roboto-regular" style="max-width: 560px;">

        <h6 class="fw-bold text-secondary text-uppercase mb-3" style="font-size: 0.75rem; letter-spacing: 1px;">
            <i class="fa-solid fa-list-ul me-1"></i>Бүх медал
        </h6>

        <div id="badge-list">
            <div class="text-center text-muted py-5">
                <span class="spinner-border spinner-border-sm me-2"></span>Уншиж байна...
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/3fd870c410.js" crossorigin="anonymous"></script>
    <script type="module" src="js/badges.js"></script>
</body>
</html>
