<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх | Санхүүгийн самбар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="roboto-regular login-page">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-8 col-11">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <h5 class="login-title">
                            <i class="fa-solid fa-sack-dollar login-brand-icon me-2"></i>Хувийн санхүүгийн бүртгэл
                        </h5>
                        <p class="login-sub">Нэвтрэх эсвэл шинээр бүртгүүлэх</p>
                    </div>
                    <form id="auth-form">
                        <div class="mb-3">
                            <label class="login-label">Имайл хаяг</label>
                            <input type="email" class="form-control login-input" id="email" required placeholder="name@gmail.com">
                        </div>
                        <div class="mb-4">
                            <label class="login-label">Нууц үг</label>
                            <input type="password" class="form-control login-input" id="password" required placeholder="••••••••">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" id="btn-login" class="btn login-btn-primary">Нэвтрэх</button>
                            <button type="button" id="btn-register" class="btn login-btn-secondary">Шинээр бүртгүүлэх</button>
                        </div>
                    </form>
                    <div id="message" class="login-message"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/3fd870c410.js" crossorigin="anonymous"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
